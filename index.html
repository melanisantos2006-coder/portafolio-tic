<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portafolio Interactivo de TIC - Santos Alejandra</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde7f3; --ink:#3b2a4a; --card:#ffffff; --mut:#7a6a8f;
  --lil:#ecdcff; --lil2:#d7b9f5; --lil3:#9b72d0; --pink:#ffc6de; --pink2:#ff9ec6;
  --mint:#d9f5e7; --blue:#cfe8ff; --cream:#fff8fd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',system-ui,sans-serif;font-weight:600;color:var(--ink);background:var(--bg);
  background-image:linear-gradient(rgba(155,114,208,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(155,114,208,.10) 1px,transparent 1px);
  background-size:28px 28px;min-height:100vh}
a{color:inherit}
button,input,textarea{font-family:inherit}

/* --- ventanas estilo sticker --- */
.win{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;margin-bottom:26px}
.win-bar{background:var(--lil);padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ink);font-family:'Fredoka',sans-serif;font-weight:600;font-size:.98rem}
.dots{display:flex;gap:6px}
.dots span{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.x-btn{margin-left:auto;width:24px;height:24px;border:2px solid var(--ink);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.chrome{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:3px solid var(--ink)}
.chrome button{width:30px;height:30px;border:2px solid var(--ink);border-radius:10px;background:var(--cream);cursor:pointer;font-size:1rem;font-weight:700;color:var(--ink)}
.chrome button:hover{background:var(--pink)}
.addr{flex:1;background:var(--lil);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-size:.85rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.heart-btn{width:34px!important;height:30px;border-radius:999px!important;font-size:1.05rem!important}
.heart-btn.on{background:var(--pink2)!important}
.win-body{padding:20px}
.win h2{font-family:'Fredoka',sans-serif;font-size:1.2rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.win h2 small{font-family:'Quicksand',sans-serif;font-weight:600;color:var(--mut);font-size:.8rem}

/* --- barra lateral: reproductor + carpetas --- */
#side{width:300px;position:fixed;top:0;bottom:0;left:0;padding:16px;z-index:50;display:flex;flex-direction:column;gap:14px}
.player{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.brand{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:var(--ink);text-align:center;margin-bottom:10px}
.brand small{display:block;font-family:'Quicksand',sans-serif;color:var(--mut);font-size:.78rem}
.ctrl{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.ctrl button{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);font-size:1rem;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.ctrl button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pbar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.pbar div{height:100%;width:0;background:repeating-linear-gradient(45deg,var(--lil2) 0 8px,var(--pink2) 8px 16px);transition:width .4s}
#prog-txt{text-align:center;font-size:.8rem;margin-top:6px;color:var(--mut)}
.search{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 14px;outline:none;font-size:.9rem;width:100%}
#lista-wrap{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#lista{overflow-y:auto;padding:8px 12px 16px;flex:1}
.u-tit{font-family:'Fredoka',sans-serif;font-size:.95rem;font-weight:600;margin:12px 4px 6px;display:flex;align-items:center;gap:8px}
.u-tit i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
#lista a{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border-radius:999px;text-decoration:none;font-size:.9rem;margin-bottom:4px;border:2px solid transparent}
#lista a:hover{background:var(--cream);border-color:var(--ink)}
#lista a.act{background:var(--lil2);border-color:var(--ink)}
#lista .ok{color:#d6336c;font-weight:700}
.side-links{display:flex;gap:8px}
.side-links a{flex:1;text-align:center;text-decoration:none;background:var(--mint);border:2px solid var(--ink);border-radius:999px;padding:6px;font-size:.85rem;font-family:'Fredoka',sans-serif;font-weight:600;box-shadow:2px 2px 0 var(--ink)}

/* --- contenido --- */
#main{margin-left:335px;padding:26px 30px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
#menu-btn{display:none;background:var(--pink);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:'Fredoka',sans-serif;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.notch{margin:0 auto;width:220px;height:34px;background:var(--ink);border-radius:0 0 18px 18px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:.9rem;letter-spacing:.06em}

.hero{display:grid;grid-template-columns:1.05fr .95fr;background:linear-gradient(160deg,#fff 0%,var(--lil) 100%)}
.hero .txt{padding:26px 28px}
.chip{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.hero h1{font-family:'Fredoka',sans-serif;font-size:2.1rem;font-weight:600;line-height:1.1;margin-bottom:10px}
.hero p{font-size:1.02rem;line-height:1.6}
.hero .art{padding:18px;border-left:3px solid var(--ink);background:var(--cream);display:flex;align-items:center;justify-content:center}
.hero .art svg{width:100%;height:auto;max-width:300px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.flips{display:grid;gap:12px}
.flip{height:96px;perspective:900px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;border-radius:18px}
.flip.on .flip-in{transform:rotateX(180deg)}
.f-front,.f-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;border:3px solid var(--ink)}
.f-front{background:var(--c,var(--lil));font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600}
.f-front span{font-family:'Quicksand',sans-serif;font-size:.78rem;font-weight:700;opacity:.8}
.f-back{transform:rotateX(180deg);background:#fff;font-size:.95rem}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.gi{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--cream);border:3px dashed var(--ink);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.85rem;text-align:center;padding:8px}
.gi img{width:100%;height:100%;object-fit:cover}
.gi button{position:absolute;top:6px;right:6px;background:#fff;border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;cursor:pointer;font-weight:700}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acciones input{flex:1;min-width:180px;padding:8px 14px;border-radius:999px;border:3px solid var(--ink);background:#fff;outline:none;font-size:.9rem;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--pink);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:7px 16px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{background:var(--pink2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.blue{background:var(--blue)}
.btn.blue:hover{background:#b7dbff}
.btn.mint{background:var(--mint)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.video{position:relative;padding-bottom:56.25%;height:0;border-radius:18px;overflow:hidden;border:3px solid var(--ink);margin-bottom:10px;background:var(--cream)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vidT{font-size:.85rem;color:var(--mut);margin-bottom:12px}
.vacio{color:var(--mut);font-size:.92rem;margin-bottom:12px;padding:18px;text-align:center;border:3px dashed var(--ink);border-radius:18px;background:var(--cream)}
.fuentes{list-style:none;display:grid;gap:8px;margin-bottom:12px}
.fuentes a{display:block;background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:8px 12px;text-decoration:none;font-size:.88rem;word-break:break-all}
.fuentes a:hover{background:var(--mint)}

.nav-tema{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 22px}
.nav-tema a{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--ink);text-decoration:none;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}

/* diálogo estilo "Are you sure" */
.dialog{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);max-width:460px;margin:0 auto 26px;overflow:hidden;text-align:center}
.dialog .dt{background:var(--lil2);padding:14px;font-family:'Fredoka',sans-serif;font-size:1.15rem;border-bottom:3px solid var(--ink)}
.dialog .db{padding:16px;display:grid;gap:10px}
.dialog button{background:var(--pink);border:3px solid var(--ink);border-radius:12px;padding:8px;font-family:'Fredoka',sans-serif;font-size:1rem;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}

.u-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.u-card{border:3px solid var(--ink);border-radius:22px;padding:20px;text-decoration:none;box-shadow:6px 6px 0 var(--ink);background:var(--c);transition:transform .1s;position:relative;overflow:hidden}
.u-card:hover{transform:translate(-2px,-2px)}
.u-card h3{font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:600;margin-bottom:4px}
.u-card p{font-size:.92rem}
.u-card .folder-tab{position:absolute;top:-3px;left:18px;width:90px;height:16px;background:var(--c);border:3px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0}

.cover{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.cover .datos{display:grid;gap:10px}
.cover .datos div{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 14px}
.drow{display:flex;align-items:center;gap:12px;font-weight:600;box-shadow:3px 4px 0 var(--ink);transition:transform .2s}
.drow:hover{transform:translateY(-2px) rotate(0deg)!important}
.dico{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:1.25rem}
.dcol{display:grid;gap:14px;justify-items:center}
.bubble{position:relative;width:100%;background:#fff;border:2.5px solid var(--ink);border-radius:22px;padding:14px 18px;box-sizing:border-box;box-shadow:4px 4px 0 var(--ink)}
.bubble p{margin:0;font-size:.95rem;line-height:1.55}
.bubble::after{content:"";position:absolute;left:30px;bottom:-12px;width:20px;height:20px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.dsvg{width:100%;max-width:260px;height:auto;display:block}
.stats{display:flex;gap:16px;justify-content:center}
.stat{width:92px;height:92px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;line-height:1}
.stat b{font-size:1.8rem}
.stat small{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stat.s1{animation:flota 3.2s ease-in-out infinite}
.stat.s2{animation:flota 3.2s ease-in-out infinite;animation-delay:.8s}

.quiz-q{margin-bottom:16px}
.quiz-q p{font-family:'Fredoka',sans-serif;font-size:1.05rem;font-weight:600;margin-bottom:8px}
.quiz-q label{display:block;padding:9px 14px;border-radius:999px;background:#fff;border:2px solid var(--ink);margin:6px 0;cursor:pointer}
.quiz-q label:hover{background:var(--cream)}
.res{font-family:'Fredoka',sans-serif;font-size:1.1rem;margin-top:12px;color:#d6336c}
.okc{color:#2b8a57!important}
.malc{color:#d6336c!important}

.bib-list{list-style:none;display:grid;gap:12px}
.bib-list li{background:var(--cream);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:.92rem;line-height:1.5;text-indent:-18px;padding-left:32px}
.bib-group h3{font-family:'Fredoka',sans-serif;font-size:1.1rem;margin:16px 0 8px}
.bib-note{font-size:.85rem;color:var(--mut);margin-bottom:12px}
textarea.mis-ref{width:100%;min-height:120px;border-radius:18px;border:3px solid var(--ink);padding:12px;font-size:.92rem;outline:none;background:#fff;color:var(--ink)}

@media(max-width:1000px){
  #side{transform:translateX(-110%);transition:transform .3s;width:300px}
  #side.abierto{transform:translateX(0)}
  #main{margin-left:0;padding:18px 14px}
  #menu-btn{display:inline-block}
  .hero{grid-template-columns:1fr}
  .hero .art{border-left:none;border-top:3px solid var(--ink)}
  .cover{grid-template-columns:1fr}
  .cover .dcol{order:-1}
}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulso{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.dibs svg .flota{animation:flota 3.2s ease-in-out infinite}
.dibs svg .pulso{transform-box:fill-box;transform-origin:center;animation:pulso 2.4s ease-in-out infinite}
.dibs svg{transition:transform .25s}
.dibs svg:hover{transform:translateY(-3px) rotate(-.4deg)}
.dibs svg{max-width:260px;margin:0 auto}
[data-dib]{cursor:pointer}
.dib-over{position:fixed;inset:0;background:rgba(59,42,74,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.dib-over.on{display:flex}
.dib-box{background:#fff;border:3px solid var(--ink);border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:6px 6px 0 var(--ink);position:relative}
.dib-box h3{margin:0 0 10px;font-size:1.15rem}
.dib-box p,.dib-box li{font-size:.95rem;line-height:1.55}
.dib-box ul{padding-left:20px}
.dib-x{position:absolute;top:10px;right:12px;border:2px solid var(--ink);background:var(--cream);border-radius:10px;padding:2px 10px;cursor:pointer;font-size:1rem}
.dib-box{background:linear-gradient(165deg,#ffffff 0%,#fdf4ff 55%,#eef7ff 100%);border:3px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:26px 24px 22px;overflow:hidden}
.dib-box::before{content:"";position:absolute;inset:9px;border:2px dashed var(--c);border-radius:18px;pointer-events:none;opacity:.9}
.dib-head{position:relative;z-index:1;display:flex;align-items:center;gap:14px;background:var(--c);border:2.5px solid var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:14px;box-shadow:4px 4px 0 var(--ink)}
.dib-ico{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:1.9rem;box-shadow:2px 2px 0 var(--ink)}
.dib-tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);opacity:.85}
.dib-head h3{margin:2px 0 0;font-size:1.2rem;line-height:1.2}
.dib-body{position:relative;z-index:1;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;background-image:radial-gradient(circle,#f1d6ee 1.2px,transparent 1.4px);background-size:16px 16px}
.dib-banner{display:block;width:100%;height:auto;border:2.5px solid var(--ink);border-radius:16px;margin-bottom:12px;box-shadow:4px 4px 0 var(--ink)}
.dib-pie{margin-top:12px;text-align:center;font-size:.8rem;color:var(--mut);letter-spacing:.04em}
.dib-body{border-left:6px solid var(--c)}
.dib-body p{margin:0 0 8px}
.dib-body p:last-child{margin-bottom:0}
.dib-body .btn{margin-top:10px}
.dib-deco{position:absolute;z-index:0;font-size:1.3rem;color:var(--ink);pointer-events:none;animation:flota 3.4s ease-in-out infinite}
.dib-deco.d1{top:14px;left:-4px;color:#ff8fc6}
.dib-deco.d2{top:58%;right:6px;color:#f5c542;animation-delay:.6s}
.dib-deco.d3{bottom:12px;left:18px;color:#c79cf5;animation-delay:1.2s}
.dib-deco.d4{top:12px;right:52px;color:#6cc8a0;animation-delay:1.8s}
.dib-x{z-index:2;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:#ffc6de;border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:700;padding:0;display:grid;place-items:center}
.dib-x:hover{transform:rotate(90deg);transition:transform .2s}
.pw{position:relative;background:#ffd9ea radial-gradient(circle,#ffb8d6 1.5px,transparent 2px) 0 0/22px 22px;border:3px solid var(--ink);border-radius:28px;padding:34px 30px;margin-bottom:26px;box-shadow:8px 8px 0 var(--ink)}
.stk{position:absolute;z-index:2;width:62px;height:62px;border:2.5px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;animation:flota 3.4s ease-in-out infinite}
.stk svg{width:42px;height:42px;overflow:visible}
.bw{position:relative;z-index:1;background:#fff;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.bw-top{display:flex;align-items:center;gap:12px;background:#d7b9f5;border-bottom:3px solid var(--ink);padding:10px 14px}
.bw-tab{background:#fff;border:2px solid var(--ink);border-radius:12px 12px 0 0;padding:4px 14px;font-weight:700;font-size:.85rem}
.bw-body{padding:22px 22px 26px;background:linear-gradient(170deg,#ffffff 0%,#fff0f7 100%)}
.bw-title{font-family:'Fredoka',sans-serif;font-size:clamp(1.6rem,4vw,2.4rem);text-align:center;color:#ff7fb7;text-shadow:3px 3px 0 var(--ink);margin:0 0 18px;letter-spacing:.03em}
.bw-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:22px;align-items:start}
.bw-frame{border:3px solid var(--ink);border-radius:22px;background:#ecdcff;padding:12px;box-shadow:4px 4px 0 var(--ink)}
.bw-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:#d7b9f5;border-top:3px solid var(--ink);padding:8px 14px;font-size:.8rem;font-weight:700}
@media (max-width:760px){.bw-grid{grid-template-columns:1fr}.pw{padding:26px 14px}.stk{transform:scale(.7)}}
</style>
</head>
<body>

<aside id="side">
  <div class="player">
    <div class="brand">🌸 Portafolio de TIC<small>Santos Alejandra · Primero "C"</small></div>
    <div class="ctrl">
      <button id="prev" title="Tema anterior">⏮</button>
      <button id="marcar" title="Marcar como estudiado">♥</button>
      <button id="next" title="Tema siguiente">⏭</button>
    </div>
    <div class="pbar"><div id="barra"></div></div>
    <div id="prog-txt"></div>
  </div>
  <input class="search" id="buscar" placeholder="🔎 Buscar un tema...">
  <div class="side-links">
    <a href="#inicio">🏠 Inicio</a>
    <a href="#bibliografia">📚 Bibliografía</a>
  </div>
  <div id="lista-wrap"><nav id="lista"></nav></div>
</aside>

<main id="main">
  <div class="topbar">
    <button id="menu-btn">☰ Temas</button>
    <div class="notch">♡ PORTAFOLIO TIC ♡</div>
  </div>
  <div id="vista"></div>
</main>

<script>
const UNIDADES = [
  { n: 'Unidad 1', s: 'Fundamentos de la comunicación y redacción', c: '#ffc6de' },
  { n: 'Unidad 2', s: 'Comunicación no verbal y paralingüística', c: '#d7b9f5' },
  { n: 'Unidad 3', s: 'Búsqueda de información y bases de datos', c: '#cfe8ff' },
  { n: 'Unidad 4', s: 'Software e IA para documentos y presentaciones', c: '#d9f5e7' }
];

/* vid = video real encontrado en las búsquedas (enlace de YouTube) */
const TEMAS = [

/* ---------- dibujos kawaii propios (SVG) ---------- */

  const c = [[0,0,18],[22,-10,24],[48,0,18],[30,10,16]].map(p => [x + p[0]*s, y + p[1]*s, p[2]*s]);
  const borde = c.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]+3}" fill="#3b2a4a"/>`).join('');
  const relleno = c.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="#ffffff"/>`).join('');
  return borde + relleno;
}
function corazon(x, y, s, col) {
  return `<path transform="translate(${x},${y}) scale(${s})" d="M0,6 C-14,-6 -22,-2 -12,-12 C-6,-18 0,-14 0,-8 C0,-14 6,-18 12,-12 C22,-2 14,-6 0,6Z" fill="${col}" stroke="#3b2a4a" stroke-width="2.5"/>`;
}
function destello(x, y, s) {
  return `<path transform="translate(${x},${y}) scale(${s})" d="M0,-12 Q2,-2 12,0 Q2,2 0,12 Q-2,2 -12,0 Q-2,-2 0,-12Z" fill="#ffffff" stroke="#3b2a4a" stroke-width="2"/>`;
}

  ].join('');

/* ---------- dibujos por tema (SVG, relacionados con cada tema) ---------- */
const INK = '#3b2a4a';
const PAL = ['#ffc6de', '#d7b9f5', '#cfe8ff', '#d9f5e7', '#fff3b8', '#ffd9b8'];
function esc2(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function tx(x, y, label, fs, maxc) {
  const lines = []; let cur = '';
  String(label).split(' ').forEach(w => {
    if ((cur + ' ' + w).trim().length > maxc && cur) { lines.push(cur); cur = w; }
    else cur = (cur + ' ' + w).trim();
  });
  lines.push(cur);
  const lh = fs * 1.15, y0 = y - (lines.length - 1) * lh / 2 + fs * 0.35;
  return `<text font-size="${fs}" text-anchor="middle" font-family="Fredoka, sans-serif" fill="${INK}">${lines.map((l, i) => `<tspan x="${x}" y="${(y0 + i * lh).toFixed(1)}">${esc2(l)}</tspan>`).join('')}</text>`;
}
function pill(x, y, w, h, txt, fill, fs) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill || '#ffffff'}" stroke="${INK}" stroke-width="2.5"/>` + tx(x + w / 2, y + h / 2, txt, fs || 12, 18);
}
function frame(color, inner) {
  return `<svg viewBox="0 0 400 280" style="width:100%;height:auto" role="img"><rect width="400" height="280" rx="18" fill="${color}"/><rect x="8" y="8" width="384" height="264" rx="14" fill="none" stroke="${INK}" stroke-width="3" stroke-dasharray="2 8"/>${destello(30, 262, 0.8)}${destello(372, 22, 0.8)}${inner}</svg>`;
}
const R = {
  flow(items) {
    const n = items.length, gap = 24, m = 18, w = (400 - 2 * m - (n - 1) * gap) / n, h = 76, y = 112;
    return items.map((it, i) => {
      const x = m + i * (w + gap);
      let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="${PAL[i % PAL.length]}" stroke="${INK}" stroke-width="3"/>` + tx(x + w / 2, y + h / 2, it, n > 3 ? 12 : 14, n > 3 ? 10 : 13);
      if (i < n - 1) {
        const ax = x + w + 4, bx = x + w + gap - 4, ay = y + h / 2;
        s += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${ay}" stroke="${INK}" stroke-width="3"/><path d="M${bx},${ay - 7} L${bx + 8},${ay} L${bx},${ay + 7}Z" fill="${INK}"/>`;
      }
      return s;
    }).join('');
  },
  hub(c, items) {
    const n = items.length, cx = 200, cy = 140;
    const pos = items.map((_, i) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return [cx + 128 * Math.cos(a), cy + 92 * Math.sin(a)]; });
    const lines = pos.map(p => `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="${INK}" stroke-width="3" stroke-dasharray="6 6"/>`).join('');
    const pills = items.map((it, i) => pill(pos[i][0] - 62, pos[i][1] - 17, 124, 34, it, PAL[(i + 1) % PAL.length], 12)).join('');
    return lines + `<circle cx="${cx}" cy="${cy}" r="56" fill="#ffffff" stroke="${INK}" stroke-width="3.5"/>` + tx(cx, cy, c, 15, 10) + pills;
  },
  layers(items) {
    const n = items.length, h = (200 - (n - 1) * 10) / n;
    return items.map((it, i) => { const y = 45 + i * (h + 10); return `<rect x="70" y="${y}" width="260" height="${h}" rx="16" fill="${PAL[i % PAL.length]}" stroke="${INK}" stroke-width="3"/>` + tx(200, y + h / 2, it, 15, 22); }).join('');
  },
  steps(items) {
    const n = items.length, w = (360 - (n - 1) * 10) / n, base = 250;
    return items.map((it, i) => {
      const hh = n === 3 ? 60 + i * 55 : 50 + i * 45, x = 20 + i * (w + 10), y = base - hh;
      return `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="12" fill="${PAL[i % PAL.length]}" stroke="${INK}" stroke-width="3"/>` + tx(x + w / 2, y + 24, it, 13, 11);
    }).join('');
  },
  compare(a, b) {
    const card = (x, arr, col) => { const [t, ...ls] = arr;
      return `<rect x="${x}" y="40" width="170" height="200" rx="18" fill="#ffffff" stroke="${INK}" stroke-width="3"/>` + pill(x + 12, 50, 146, 30, t, col, 13) + ls.map((l, i) => tx(x + 85, 116 + i * 34, l, 13, 16)).join(''); };
    return card(24, a, PAL[0]) + card(206, b, PAL[2]);
  },
  callouts(items) {
    const n = items.length;
    const fig = `<circle cx="100" cy="105" r="36" fill="#ffffff" stroke="${INK}" stroke-width="3.5"/><circle cx="88" cy="100" r="3.5" fill="${INK}"/><circle cx="112" cy="100" r="3.5" fill="${INK}"/><circle cx="80" cy="116" r="5" fill="#ffc6de"/><circle cx="120" cy="116" r="5" fill="#ffc6de"/><path d="M90,116 Q100,126 110,116" fill="none" stroke="${INK}" stroke-width="2.5"/><rect x="70" y="146" width="60" height="84" rx="24" fill="#d7b9f5" stroke="${INK}" stroke-width="3"/>`;
    const ys = items.map((_, i) => 36 + i * (n > 1 ? 174 / (n - 1) : 0));
    const lines = ys.map(y => `<line x1="138" y1="150" x2="252" y2="${y + 17}" stroke="${INK}" stroke-width="2.5" stroke-dasharray="5 5"/>`).join('');
    return fig + lines + items.map((it, i) => pill(252, ys[i], 132, 34, it, PAL[i % PAL.length], 12)).join('');
  },
  faces(items) {
    return items.map((it, i) => {
      const cx = 72 + (i % 3) * 128, cy = 88 + Math.floor(i / 3) * 100;
      let mouth;
      if (i === 0) mouth = `<path d="M${cx - 13},${cy + 8} Q${cx},${cy + 22} ${cx + 13},${cy + 8}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
      else if (i === 1) mouth = `<path d="M${cx - 13},${cy + 16} Q${cx},${cy + 2} ${cx + 13},${cy + 16}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
      else if (i === 2) mouth = `<circle cx="${cx}" cy="${cy + 14}" r="5" fill="${INK}"/>`;
      else if (i === 3) mouth = `<path d="M${cx - 17},${cy - 14} L${cx - 6},${cy - 10} M${cx + 17},${cy - 14} L${cx + 6},${cy - 10} M${cx - 10},${cy + 14} L${cx + 10},${cy + 14}" stroke="${INK}" stroke-width="2.5" fill="none"/>`;
      else if (i === 4) mouth = `<ellipse cx="${cx}" cy="${cy + 14}" rx="4" ry="6" fill="${INK}"/>`;
      else mouth = `<path d="M${cx - 12},${cy + 12} Q${cx - 6},${cy + 6} ${cx},${cy + 12} T${cx + 12},${cy + 12}" fill="none" stroke="${INK}" stroke-width="2.5"/>`;
      return `<circle cx="${cx}" cy="${cy}" r="32" fill="#ffffff" stroke="${INK}" stroke-width="3"/><circle cx="${cx - 11}" cy="${cy - 7}" r="3" fill="${INK}"/><circle cx="${cx + 11}" cy="${cy - 7}" r="3" fill="${INK}"/>` + mouth + tx(cx, cy + 52, it, 13, 14);
    }).join('');
  },
  wave(items) {
    const n = items.length, slot = 360 / n;
    const tags = items.map((it, i) => { const w = Math.min(110, slot - 12), x = 20 + i * slot + (slot - w) / 2; return pill(x, 196, w, 34, it, PAL[i % PAL.length], 12); }).join('');
    return `<path d="M20,120 C50,50 80,190 110,120 S170,50 200,120 S260,190 290,120 S350,50 380,120" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/><path d="M20,150 C50,100 80,200 110,150 S170,100 200,150 S260,200 290,150 S350,100 380,150" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".8"/>` + tags;
  },
  rings(items) {
    const r = [130, 90, 50], fills = ['#ffffff', '#ecdcff', '#ffc6de'];
    const circles = r.map((rad, i) => `<circle cx="200" cy="140" r="${rad}" fill="${fills[i]}" stroke="${INK}" stroke-width="3"/>`).join('');
    const labels = tx(200, 30, items[0], 13, 16) + tx(200, 70, items[1], 13, 14) + tx(200, 140, items[2], 13, 9);
    return circles + labels;
  },
  cards(items) {
    const n = items.length;
    if (n === 4) return items.map((it, i) => { const x = i % 2 ? 212 : 32, y = i < 2 ? 52 : 146; return `<rect x="${x}" y="${y}" width="156" height="72" rx="16" fill="${PAL[i % PAL.length]}" stroke="${INK}" stroke-width="3"/>` + tx(x + 78, y + 36, it, 13, 13); }).join('');
    const h = 48, g = 14, y0 = 140 - (n * h + (n - 1) * g) / 2;
    return items.map((it, i) => { const y = y0 + i * (h + g); return `<rect x="70" y="${y}" width="260" height="${h}" rx="16" fill="${PAL[i % PAL.length]}" stroke="${INK}" stroke-width="3"/>` + tx(200, y + h / 2, it, 14, 24); }).join('');
  }
};
function hubIn(c, items) { return R.hub(c, items); }

    if (i < nombres.length - 1) s += `<path d="M${x + 104},171 L${x + 120},171" stroke="${INK}" stroke-width="3"/><path d="M${x + 118},165 L${x + 126},171 L${x + 118},177Z" fill="${INK}"/>`;
  });
  return svgTema(t, s + brillo(360, 230, 0.8) + brillo(36, 236, 0.7), 'Dibujo de conceptos del tema');
}
function dibujoConstelacion(t) {
  const ic8 = iconosTema(t);
  const pos = [[70, 84], [200, 58], [330, 86], [62, 200], [200, 226], [338, 198]];
  const lineas = pos.map(p => `<line x1="200" y1="140" x2="${p[0]}" y2="${p[1]}" stroke="${INK}" stroke-width="2" stroke-dasharray="5 6"/>`).join('');
  const iconos = pos.map((p, i) => ic(ic8[i % ic8.length], p[0], p[1], 1 + (i % 2) * 0.15, (i % 3) * 8 - 8)).join('');
  return svgTema(t, lineas + `<rect x="110" y="118" width="180" height="44" rx="22" fill="#ffffff" stroke="${INK}" stroke-width="3"/>` + tx(200, 140, t.t, 13, 16) + iconos, 'Mapa visual del tema');
}

function attachTema(t) {

    const guardado = get('vid-' + t.id, '');
    const id = ytId(guardado) || t.vid || '';
    const titulo = guardado ? 'Video que guardaste' : (t.vidT ? 'Video encontrado: ' + t.vidT : '');
    const q = encodeURIComponent(t.t + ' explicación');
    const enlaceYT = id ? `https://www.youtube.com/watch?v=${id}` : `https://www.youtube.com/results?search_query=${q}`;
    const caja = id
      ? `<img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="Portada del video del tema" style="width:100%;display:block">`
      : `<div style="height:260px;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:1.1rem;color:var(--ink);text-align:center;padding:20px">Haz clic para ver los videos de este tema en YouTube</div>`;
    $('#video').innerHTML = `<a href="${enlaceYT}" target="_blank" rel="noopener" style="display:block;position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;text-decoration:none">${caja}<span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:#ff9ec6;border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;color:var(--ink)">▶</span></a><div class="vidT">${id ? titulo : 'Videos encontrados en YouTube para este tema.'} · <a href="${enlaceYT}" target="_blank" rel="noopener">Abrir en YouTube ↗</a></div>`;
  }
  pintarVideo();
  $('#guar-vid').onclick = () => {
    const v = $('#url-vid').value.trim();
    if (!ytId(v)) { alert('Ese enlace no parece de YouTube.'); return; }
    set('vid-' + t.id, v);
    $('#url-vid').value = '';
    pintarVideo();
  };

  const corazon = $('#corazon');
  corazon.onclick = () => {
    const ya = !estudiado(t.id);
    set('visto-' + t.id, ya ? '1' : '');
    corazon.classList.toggle('on', ya);
    progreso(); buildLista();
  };
}

      if (ok) aciertos++;
      const txt = document.getElementById('pq' + j);
      txt.classList.remove('okc', 'malc');
      txt.classList.add(ok ? 'okc' : 'malc');
    });
    const total = QUIZ[ui].length;
    $('#res').textContent = 'Tuviste ' + aciertos + ' de ' + total + ' correctas. ' +
      (aciertos === total ? '¡Excelente! 🌸' : 'Repasa el tema y vuelve a intentar.');
  };
}

function attachBib() {
  attachChrome();
  const ta = $('#mis-ref');
  ta.value = get('mis-ref', '');
  ta.oninput = () => set('mis-ref', ta.value);
}

/* ---------- enrutado ---------- */
function render() {
  const h = location.hash.slice(1) || 'inicio';
  const t = TEMAS.find(x => x.id === h);
  let html, after = () => {};
  if (t) {
    html = vTema(t); after = () => attachTema(t);
  } else if (h === 'bibliografia') {
    html = vBibliografia(); after = attachBib;
  } else if (h.startsWith('quiz-') && QUIZ[parseInt(h.slice(5), 10)]) {
    const ui = parseInt(h.slice(5), 10);
    html = vQuiz(ui); after = () => attachQuiz(ui);
  } else {
    html = vInicio(); after = attachChrome;
  }
  $('#vista').innerHTML = html;
  after();
  buildLista();
  progreso();
  $('#side').classList.remove('abierto');
  window.scrollTo(0, 0);
}

function irTema(delta) {
  const cur = location.hash.slice(1);
  const idx = TEMAS.findIndex(t => t.id === cur);
  const nuevo = TEMAS[idx + delta];
  if (nuevo) location.hash = nuevo.id;
  else if (delta > 0) location.hash = 'bibliografia';
}

/* ---------- arranque ---------- */
$('#buscar').addEventListener('input', buildLista);
$('#menu-btn').onclick = () => $('#side').classList.toggle('abierto');
$('#prev').onclick = () => irTema(-1);
$('#next').onclick = () => irTema(1);
$('#marcar').onclick = () => {
  const cur = TEMAS.find(t => t.id === location.hash.slice(1));
  if (!cur) return;
  set('visto-' + cur.id, estudiado(cur.id) ? '' : '1');
  progreso(); buildLista();
};
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
